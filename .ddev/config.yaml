name: aic-nextgen
type: php
docroot: public
php_version: "8.5"
# nginx-fpm (DDEV's default web server) serves public/index.php interpreted:
# the reference the compiled site is compared with (gate:23). The runtime is
# the compiled elephc --web server (composer run native:serve).
database:
    type: postgres
    version: "17"
performance_mode: none
composer_version: "2"
corepack_enable: false
xdebug_enabled: false
use_dns_when_possible: true
