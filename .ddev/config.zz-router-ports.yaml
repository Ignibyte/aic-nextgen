# Route FrankenPHP through the router's own ports on the dev box.
#
# The ddev/ddev-frankenphp add-on asks the router for 80 and 443. The host's
# nginx owns those, so DDEV falls back to ephemeral ports that move on every
# restart. This file loads after config.frankenphp.yaml and replaces the
# add-on's port list with the box's router ports (router_http_port and
# router_https_port in ~/.ddev/global_config.yaml), so the site stays at
# https://aic-nextgen.ddev.site:8843 and the host nginx's *.ddev.site proxy
# on 443 reaches it too.
override_config: true
web_extra_exposed_ports:
  - name: frankenphp
    container_port: 80
    http_port: 8880
    https_port: 8843
