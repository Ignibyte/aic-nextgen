# The socket server (#32): `bin/aic socket:serve`, started by the
# web_extra_daemons entry in config.yaml, answers the WebSocket upgrades
# under /ws/. Host keeps its port, so the server's Origin check sees the
# site's own authority.
location /ws/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 1h;
}
