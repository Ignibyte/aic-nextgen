# Splits each AIC package into its read-only repository when a release tag is pushed (#278).
# Packagist reads a composer.json at a repository's root, so ignibyte/aic-framework, -gates,
# -scaffold (#279) and -workflow each get one: Ignibyte/aic-framework, Ignibyte/aic-gates,
# Ignibyte/aic-scaffold, Ignibyte/aic-workflow.
# Those repositories take no pull requests; changes land here. AIC_SPLIT_TOKEN is a repository
# secret that may push to them.
name: split

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Split each package
        run: bin/split-packages.sh "$GITHUB_REF_NAME" | tee "$RUNNER_TEMP/split.txt"
      - name: Push each split and the tag
        env:
          AIC_SPLIT_TOKEN: ${{ secrets.AIC_SPLIT_TOKEN }}
        run: |
          while read -r package directory branch commit; do
            echo "$package ($directory, $branch) at $commit"
            remote="https://x-access-token:${AIC_SPLIT_TOKEN}@github.com/Ignibyte/${package#ignibyte/}.git"
            git push "$remote" "$commit:refs/heads/main"
            git push "$remote" "$commit:refs/tags/$GITHUB_REF_NAME"
          done < "$RUNNER_TEMP/split.txt"
