# gate:12 — Deptrac, AIC's own config (#116): the layers and the ruleset are
# ignibyte/aic-gates' base; this file names AIC's paths.
imports:
  - vendor/ignibyte/aic-gates/config/deptrac.yaml

deptrac:
  # Templates are checked by gate:25, not the class tools (Chad, 2026-10-21, #96).
  exclude_files:
    - '#\.tpl\.php$#'
  paths:
    - ./framework/src
    - ./modules
    - ./themes
    - ./build/generated
    - ./gates/src
    - ./gates/architecture
    - ./workflow/src
