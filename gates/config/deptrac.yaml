# gate:12's base config (ignibyte/aic-gates, #116): the layers and the ruleset, with no
# project path. A project's deptrac.yaml imports it and names its paths.
#
# Deptrac: the layer ladder, per system, inside one package.
#
# Every system is a namespace under AIC\ (AIC\Http, AIC\Routing, ...) with the
# same subnamespaces: Contracts → Domain → Application → Infrastructure, plus
# the leaf Exception and Attribute layers. Layers are collected by class name,
# so one rule covers every system. The gate tooling (Gates\) follows the same
# ladder. `--fail-on-uncovered` makes every class sit in a layer: a class
# directly under AIC\<System>\, outside the six subnamespaces, fails the gate.
deptrac:
  layers:
    - name: Contracts
      collectors:
        - type: classLike
          value: '^AIC\\(Contracts|[^\\]+\\Contracts)\\'
    - name: Domain
      collectors:
        - type: classLike
          value: '^(AIC\\[^\\]+|Gates)\\Domain\\'
    - name: Exception
      collectors:
        - type: classLike
          value: '^(AIC\\[^\\]+|Gates)\\Exception\\'
    - name: Attribute
      collectors:
        - type: classLike
          value: '^(AIC\\[^\\]+|Gates)\\Attribute\\'
    - name: Application
      collectors:
        - type: classLike
          value: '^(AIC\\[^\\]+|Gates)\\Application\\'
    - name: Infrastructure
      collectors:
        - type: classLike
          value: '^(AIC\\[^\\]+|Gates)\\Infrastructure\\'
    # The app's modules and its generated wiring: one layer (#10).
    - name: App
      collectors:
        - type: classLike
          value: '^App\\(?!Theme\\)'
    # The theme (#153): components and page data, which the modules build and the
    # generated wiring renders. It reads only the framework's seams, never a module.
    - name: Theme
      collectors:
        - type: classLike
          value: '^App\\Theme\\'
    # The phpat rule classes (gate:9).
    - name: Architecture
      collectors:
        - type: classLike
          value: '^Gates\\Architecture\\'
    # Vendor leaves.
    - name: PsrVendor
      collectors:
        - type: classLike
          value: '^Psr\\'
    - name: PhpatVendor
      collectors:
        - type: classLike
          value: '^PHPat\\'
    - name: PhpStanRules
      collectors:
        - type: classLike
          value: '^Gates\\PhpStan\\'
    - name: PhpstanVendor
      collectors:
        - type: classLike
          value: '^PHPStan\\(?!PhpDocParser\\)'
    # shipmonk/dead-code-detector's provider API, which TemplateUsageProvider extends (#155).
    - name: ShipmonkVendor
      collectors:
        - type: classLike
          value: '^ShipMonk\\PHPStan\\DeadCode\\'
    # phpstan/phpdoc-parser, which the template build (#97) reads list element
    # types with.
    - name: PhpDocParserVendor
      collectors:
        - type: classLike
          value: '^PHPStan\\PhpDocParser\\'
    # php-parser, which gate:25's template validator (#96) and AIC's PHPStan
    # rules read.
    - name: PhpParserVendor
      collectors:
        - type: classLike
          value: '^PhpParser\\'
    # gate:25's template grammar (#96): dev tooling over php-parser.
    - name: TemplateGrammar
      collectors:
        - type: classLike
          value: '^Gates\\Templates\\'
    # The workflow's code index reads PHP with php-parser (#106); only this
    # layer reaches it.
    - name: WorkflowParsing
      collectors:
        - type: classLike
          value: '^AIC\\Workflow\\Parsing\\'
    # gate:32, module markup (#156).
    - name: ModuleMarkupGate
      collectors:
        - type: classLike
          value: '^Gates\\Markup\\'
    # gate:26's table ownership (#185), which reads modules with php-parser.
    - name: TableOwnership
      collectors:
        - type: classLike
          value: '^Gates\\Tables\\'
    # gate:27, the RawHtml count (#99).
    - name: RawHtmlGate
      collectors:
        - type: classLike
          value: '^Gates\\Rendering\\'
    # AIC's PHPMD rules (gate:10) and PHPCS sniffs (gate:11), and the tools'
    # own classes they extend or call (#56).
    - name: PhpmdRules
      collectors:
        - type: classLike
          value: '^Gates\\Phpmd\\'
    - name: PhpcsSniffs
      collectors:
        - type: classLike
          value: '^Gates\\Sniffs\\'
    - name: PhpmdVendor
      collectors:
        - type: classLike
          value: '^(PHPMD|PDepend)\\'
    - name: PhpcsVendor
      collectors:
        - type: classLike
          value: '^(PHP_CodeSniffer|SlevomatCodingStandard)\\'
    - name: RectorVendor
      collectors:
        - type: classLike
          value: '^Rector\\'
    # Composer's runtime API: where an installed package is (#116).
    - name: ComposerVendor
      collectors:
        - type: classLike
          value: '^Composer\\'

  ruleset:
    Contracts:
      - PsrVendor
    Domain:
      - Contracts
      - Attribute
      - PsrVendor
    Exception:
      - Contracts
      - PsrVendor
    Attribute:
      - Contracts
      - PsrVendor
    Application:
      - Contracts
      - Domain
      - Exception
      - Attribute
      - PsrVendor
    Infrastructure:
      - Contracts
      - Domain
      - Exception
      - Attribute
      - Application
      - PsrVendor
      - WorkflowParsing
      - ComposerVendor
      - RectorVendor
    # The app builds on the framework's seams, never on its Infrastructure.
    App:
      - Contracts
      - Domain
      - Exception
      - Attribute
      - Application
      - PsrVendor
      - Theme
    Theme:
      - Contracts
      - Domain
      - Exception
      - Attribute
    Architecture:
      - PhpatVendor
    # AIC's own PHPStan rules (gate:8) read the contracts they police and
    # PHPStan's API, and name the one Application class each guard allows: the
    # Renderer makes an Html, Psr7ResponseWriter reads one (#99).
    PhpStanRules:
      - Contracts
      - Domain
      - Application
      - PhpstanVendor
      - ShipmonkVendor
      - PhpParserVendor
    # gate:25's validator (#96) walks php-parser's tree and reports with
    # Gates' Domain values, reading files through Application.
    TemplateGrammar:
      - Contracts
      - Domain
      - Application
      - PhpParserVendor
      - PhpDocParserVendor
    WorkflowParsing:
      - Domain
      - Exception
      - PsrVendor
      - PhpParserVendor
    ModuleMarkupGate:
      - Domain
      - Application
      - PhpParserVendor
    TableOwnership:
      - Contracts
      - Domain
      - Application
      - PhpParserVendor
    RawHtmlGate:
      - Contracts
      - Domain
      - Application
      - PhpParserVendor
    # The PHPMD rules and PHPCS sniffs wrap their tool's stock rule and ask
    # Gates' Domain which methods are kind methods (#56).
    PhpmdRules:
      - Domain
      - PhpmdVendor
    PhpcsSniffs:
      - Domain
      - PhpcsVendor
  formatters:
    graphviz:
      hidden_layers:
        - PsrVendor
