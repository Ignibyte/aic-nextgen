title = "AIC gitleaks config (gate:17)"

[extend]
useDefault = true

[[rules]]
id = "aic-anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{86,}'''
tags = ["api-key", "anthropic"]
keywords = ["sk-ant-"]

[[rules]]
id = "aic-openai-key"
description = "OpenAI API key"
regex = '''sk-(?:proj-)?[A-Za-z0-9_-]{32,}'''
tags = ["api-key", "openai"]
keywords = ["sk-"]

[[rules]]
id = "aic-google-genai-key"
description = "Google Generative AI key"
regex = '''AIzaSy[A-Za-z0-9_-]{33}'''
tags = ["api-key", "google"]
keywords = ["AIzaSy"]

[allowlist]
description = "Allowlist for AIC project"
# The workflow's progress key (#117), "key": "<xxh128>" in each phase report and run event, is a
# hash of the tree and the spec, not a credential; generic-api-key reads it as one wherever
# var/workflow/ or the probe sweep's var/probe/ is scanned (#119). Only that exact match is
# allowed: the regex is held to the whole match, so a real key elsewhere on the line, or in
# var/, is still caught.
regexTarget = "match"
regexes = [
    '''^key": ?"[0-9a-f]{32}"$''',
]
paths = [
    '''vendor/.*''',
    '''storage/.*''',
    '''\.psalm-cache/.*''',
    '''\.phpstan-cache/.*''',
    '''\.rector-cache/.*''',
    # DDEV-generated local-dev TLS certs/keys. .ddev/.gitignore excludes them
    # from commits; this entry keeps a working-tree scan from flagging them.
    '''\.ddev/traefik/certs/.*''',
    # The local-dev AIC_APP_SECRET (#43) lives in DDEV's config.local.yaml, which DDEV copies
    # into its generated compose files; .ddev/.gitignore excludes all three from commits, and
    # gate:17 still scans the history.
    '''\.ddev/config\.local\.ya?ml''',
    '''\.ddev/\.ddev-docker-compose-[a-z]+\.yaml''',
    # The planning checkout's evidence files (docs/planning, the private aic-planning repo, which
    # this repo ignores) record the SHA-256 of every file and class a ticket read, keyed by its
    # name; generic-api-key reads a digest under a name holding "token" (FormToken,
    # 10-tokens.css) as a key. They are digests, never credentials, and this repo never commits them.
    '''docs/planning/research/.*\.json''',
]
