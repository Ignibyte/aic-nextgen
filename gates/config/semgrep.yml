# gate:15 — semgrep: the AIC ruleset.
#
# Ported from old AIC's semgrep.yml (#2). Kept: every generic rule. Dropped:
# the catalog, theme, Alpine/htmx and Datastar rules (their systems are not
# here; the Datastar rule can return with the browser runtime, #12). The dbal
# Contracts SQL rule returns with the database (#6).
#
# Paths in `include`/`exclude` are anchored at the repo root. A regex rule that
# describes an absence skips comment lines, so a docblock naming the banned
# construct does not trip it.
rules:
  - id: aic-no-env-outside-config
    pattern: env(...)
    paths:
      exclude:
        - "/config/**"
        # The framework's config starters, which an app gets as config/ (#279).
        - "/framework/scaffold/config/**"
        - "/bin/**"
        - "/gates/bin/**"
    message: "env() is forbidden outside config/ (CLAUDE.md conventions): inject the resolved value."
    languages: [php]
    severity: ERROR

  - id: aic-no-getenv
    pattern: getenv(...)
    paths:
      exclude:
        - "/config/**"
        # The framework's config starters, which an app gets as config/ (#279).
        - "/framework/scaffold/config/**"
        - "/bin/**"
        - "/gates/bin/**"
    message: "getenv() is forbidden: read the environment in config/, never in business logic."
    languages: [php]
    severity: ERROR

  - id: aic-no-eval
    pattern: eval(...)
    message: "eval() is forbidden everywhere."
    languages: [php]
    severity: ERROR

  - id: aic-no-error-suppression
    pattern: '@$X'
    message: "@ error suppression is forbidden: handle the error."
    languages: [php]
    severity: ERROR

  - id: aic-no-global-keyword
    pattern-regex: '(?m)^(?!\s*(?:\*|//|/\*|#)).*\bglobal\s+\$'
    paths:
      include:
        - "*.php"
      exclude:
        - "/bin/**"
        - "/gates/bin/**"
    message: "The global keyword is forbidden: no globals (CLAUDE.md conventions)."
    languages: [generic]
    severity: ERROR

  # bootstrap/serve.php is the SAPI entry point (interpreted and compiled): the
  # one place that reads the superglobals to build the request. The bin/ entry
  # scripts read HOME for the tool lookup.
  - id: aic-no-superglobals
    pattern-regex: '(?m)^(?!\s*(?:\*|//|/\*|#)).*\$(_SERVER|_POST|_GET|_COOKIE|_FILES|_SESSION|_REQUEST|_ENV|GLOBALS)\b'
    paths:
      include:
        - "*.php"
      exclude:
        - "/bin/**"
        - "/gates/bin/**"
        - "/bootstrap/serve.php"
        - "/framework/scaffold/bootstrap/serve.php"
    message: "PHP superglobal forbidden: only the SAPI entry point (bootstrap/serve.php) reads them."
    languages: [generic]
    severity: ERROR

  - id: aic-no-suppress-annotations
    pattern-regex: '@(phpstan-ignore|psalm-suppress|phpcs:ignore|phpcs:disable|phpmd:ignore|phpmd-ignore|noinspection)'
    message: "Suppression annotations are forbidden: no suppressions, source fixes only."
    languages: [generic]
    paths:
      include:
        - "*.php"
    severity: ERROR

  # No static state (CLAUDE.md conventions): state lives in the objects the
  # composition root wires, so a request's code never depends on what an
  # earlier request left in a class.
  - id: aic-no-static-mutable-property
    pattern-regex: '^\s*(?:private|protected|public)\s+static\s+(?!readonly\b)(?!const\b)[\w\\\?\|\&]+\s+\$\w+\s*='
    message: "Static mutable properties are forbidden: state lives in the objects the composition root wires."
    languages: [generic]
    paths:
      include:
        - "*.php"
    severity: ERROR

  - id: aic-no-static-array-cache
    pattern-regex: 'static\s+\$_?cache\b'
    message: "static $cache patterns are forbidden: state lives in the objects the composition root wires."
    languages: [generic]
    paths:
      include:
        - "*.php"
    severity: ERROR

  - id: aic-no-singleton-pattern
    pattern-regex: 'private\s+static\s+\??(?:self|static)\s+\$instance\s*='
    message: "The singleton pattern is forbidden: the container wires shared services."
    languages: [generic]
    paths:
      include:
        - "*.php"
    severity: ERROR

  # Catches static-property MUTATION, which the declaration rule above cannot
  # see when the property is declared in a parent class.
  - id: aic-no-static-property-mutation-in-method
    pattern-regex: '(?:self|static|parent|[A-Z][\w\\]*)::\$\w+(?:\[[^\]]*\])?\s*(?:=|\.=|\+=|-=|\*=|/=|%=|\*\*=|\?\?=|<<=|>>=|&=|\|=|\^=|\+\+|--)|\+\+\s*(?:self|static|parent|[A-Z][\w\\]*)::\$\w+|--\s*(?:self|static|parent|[A-Z][\w\\]*)::\$\w+'
    message: "Static property mutation is forbidden: static state leaks between the requests a worker serves."
    languages: [generic]
    paths:
      include:
        - "*.php"
    severity: ERROR

  - id: aic-no-getInstance-factory
    pattern-regex: 'public\s+static\s+function\s+getInstance\s*\('
    message: "getInstance() singleton factories are forbidden: use the container."
    languages: [generic]
    paths:
      include:
        - "*.php"
    severity: ERROR

  # Function-scope `static $var` keeps its value across requests too.
  - id: aic-no-function-static-state
    pattern-regex: '(?:^|\n)\s+static\s+\$\w+\s*[=;]'
    message: "Function-static variables are forbidden: pass the state as a parameter."
    languages: [generic]
    paths:
      include:
        - "*.php"
    severity: ERROR

  # Catches `mixed` inside phpdoc generics (`array<string, mixed>`,
  # `Closure(mixed): mixed`, `iterable<mixed>`). PHPCS DisallowMixedTypeHint
  # and PHPStan checkExplicitMixed cover signatures; this covers the template
  # parameters, where mixed would otherwise slip through.
  #
  # A docblock followed by `#[Override]` is skipped: a PSR interface method
  # dictates its `mixed` (PSR-7's `withQueryParams(array $query)` admits only
  # `array<array-key, mixed>` as its contravariant phpdoc), and PHPCS
  # DisallowMixedTypeHint exempts the same overrides (Chad, 2026-10-19, #20).
  - id: aic-no-mixed-in-phpdoc-template
    patterns:
      - pattern-regex: '(?:@(?:param|return|var|property|method)\s+[^*\n]*|\s)(?:array|iterable|Generator|Closure|callable|list)<[^>]*\bmixed\b[^>]*>'
      - pattern-not-regex: '/\*\*(?:(?!\*/)[\s\S])*\*/\s*#\[Override\]'
    message: "mixed in phpdoc template parameters is forbidden (CLAUDE.md conventions): use concrete types (array<string, scalar>, iterable<int, MyType>, ...)."
    languages: [generic]
    paths:
      include:
        - "*.php"
      exclude:
        # The entry scripts decode untyped JSON at the boundary.
        - "/bin/**"
        - "/gates/bin/**"
    severity: ERROR

  # Two or more string class constants are the shape of a closed enumeration.
  - id: aic-prefer-enum-over-class-consts
    pattern-regex: '(?ms)(?:public|protected|private)\s+const\s+\w+\s*=\s*(?:''[^'']+''|"[^"]+")\s*;.*?(?:public|protected|private)\s+const\s+\w+\s*=\s*(?:''[^'']+''|"[^"]+")\s*;'
    message: "Multiple string class constants: use an enum for a closed enumeration (`enum X: string { case FOO = '...'; }`)."
    languages: [generic]
    paths:
      include:
        - "*.php"
      exclude:
        - "/bin/**"
        - "/gates/bin/**"
    severity: WARNING

  # The compiled elephc --web server is the runtime (CLAUDE.md, Stack). Comment
  # lines are skipped; the architecture rule that bans the dependency names it.
  - id: aic-no-swoole-reference
    pattern-regex: '(?m)^(?!\s*(?:\*|//|/\*|#)).*\bSwoole\\'
    message: "Swoole reference in source: Swoole is removed; the compiled elephc --web server is the runtime."
    languages: [generic]
    paths:
      include:
        - "*.php"
      exclude:
        - "/gates/architecture/CoreArchitectureTest.php"
    severity: ERROR

  # Every shell script here sets `pipefail`. A reader that stops early (grep -q,
  # -m or -l, head) closes the pipe while the producer is still writing; the
  # producer takes SIGPIPE and the pipeline fails with 141, so a check that
  # matched reads as failed once the input passes the pipe buffer (#16). Feed
  # the reader a here-string (<<< "$x") or a process substitution (< <(cmd)), or
  # take the first line with awk 'NR == 1'. Comment lines are skipped.
  - id: aic-no-early-exit-pipe
    pattern-regex: '(?m)^(?!\s*#).*(?<!\|)\|(?!\|)\s*(?:grep\s+(?:-\S+\s+)*(?:-[A-Za-z]*[qml]|--(?:quiet|silent|max-count|files-with-matches))|head\b)'
    message: "A pipe into an early-exit reader fails under pipefail once the input passes the pipe buffer: use a here-string, a process substitution, or awk 'NR == 1' (#16)."
    languages: [generic]
    paths:
      include:
        - "/.claude/hooks/*.sh"
        - "/bin/*.sh"
        - "/gates/bin/*.sh"
    severity: ERROR

  # The workflow's pack (#105) is installed into apps: it speaks to an app's agent
  # about the app and the workflow, never about how AIC itself is developed.
  - id: aic-pack-app-only
    pattern-regex: '/pipeline:|docs/planning|CONSTITUTION\.md|bin/ticket\.sh|elephc-carry'
    message: "The workflow's pack names AIC's own process; an app has none of it. Point the app's agent at bin/aic and its own files (#105)."
    languages: [generic]
    paths:
      include:
        - "/workflow/pack/**"
    severity: ERROR

  # A pack link that names claude/ resolves in the package and is dead once
  # installed, where the folder is .claude/ (#105). gate:19 checks the rest of
  # the pack's links at the source, which mirrors the app.
  - id: aic-pack-link-names-claude
    pattern-regex: '\]\((?![a-z]+:)(?:[^)]*/)?claude/'
    message: "A pack link that names claude/ is dead once installed, where the folder is .claude/: link within claude/ by relative path, or name the file in inline code (#105)."
    languages: [generic]
    paths:
      include:
        - "/workflow/pack/**"
    severity: ERROR

  # The architecture docs ship in ignibyte/aic-framework (#107) and are read by an app's
  # agent: they name no AIC process and cite no ticket an app cannot open.
  - id: aic-docs-app-only
    pattern-regex: '/pipeline:|docs/planning|CONSTITUTION\.md|bin/ticket\.sh|elephc-carry'
    message: "The architecture docs name AIC's own process; an app has none of it. Describe the rule as it holds for the app (#107)."
    languages: [generic]
    paths:
      include:
        - "/framework/docs/**"
    severity: ERROR

  - id: aic-tessera-positional-path
    pattern-regex: '\b[a-z][a-z0-9]*(?:-[a-z0-9]+)*/(?:c[0-9]+|[A-Z][A-Za-z0-9]*\.[0-9]+)(?![A-Za-z0-9_])'
    message: "A Tessera path with a positional segment (cN or Name.N) strands its target when a wrapper or an order changes: give the component an anchor and target @NAME (#188, #195)."
    languages: [generic]
    paths:
      include:
        - "/modules/**"
        - "/themes/**"
        - "/tests/browser/**"
    severity: ERROR

  - id: aic-docs-no-ticket-refs
    pattern-regex: '(?<![\w/(])#\d+'
    message: "The architecture docs cite a ticket number, which an app cannot open: state the rule as it stands; the history is in CHANGELOG (#107)."
    languages: [generic]
    paths:
      include:
        - "/framework/docs/**"
    severity: ERROR

  # The profiler (#229) is a development tool the composition root switches on: nothing else builds it, so an app
  # never records a request it did not ask to.
  - id: aic-profiler-wired-at-root
    # Both spellings: semgrep resolves a `use`d or aliased name only against the unprefixed pattern, and a written
    # fully qualified name only against the prefixed one.
    pattern-either:
      - pattern: new AIC\Profiler\Application\Profile(...)
      - pattern: new AIC\Profiler\Application\ProfiledDatabase(...)
      - pattern: new AIC\Profiler\Application\ProfileWriter(...)
      - pattern: new \AIC\Profiler\Application\Profile(...)
      - pattern: new \AIC\Profiler\Application\ProfiledDatabase(...)
      - pattern: new \AIC\Profiler\Application\ProfileWriter(...)
    paths:
      exclude:
        - "/bootstrap/serve.php"
        - "/framework/scaffold/bootstrap/serve.php"
    message: "The profiler is built only in bootstrap/serve.php, behind config/profiler.php (#229)."
    languages: [php]
    severity: ERROR

  # A profile keeps each statement's SQL, never the values bound to it (#229): in the profiler, `$params` only passes
  # through to the database that runs the statement.
  - id: aic-profiler-no-bound-values
    patterns:
      - pattern: $params
      - pattern-not-inside: $this->database->$METHOD($SQL, $params)
    paths:
      include:
        - "/framework/src/Profiler/**"
    message: "The profiler never records a bound value: pass $params straight to $this->database and nowhere else (#229)."
    languages: [php]
    severity: ERROR
